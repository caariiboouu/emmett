<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Emmett turns 7 · Splash party</title>
    <meta name="description" content="You're invited to Emmett's 7th birthday swim party. Saturday, December 5, 2:00 to 4:00 PM at Goldfish Swim School, Tulsa Hills." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#040b16" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Emmett turns 7! Open your party pack" />
    <meta property="og:description" content="A birthday swim party. Saturday, December 5, 2–4 PM. Tear open the pack to see your cards." />
    <meta property="og:url" content="https://caariiboouu.github.io/emmett/" />
    <meta property="og:image" content="https://caariiboouu.github.io/emmett/art/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="art/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Bungee+Inline&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/pack.css" />
  </head>
  <body>
    <!-- SVG filters: decorative only. If a browser drops them, only texture is lost. -->
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="crinkle" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="3" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" />
      </filter>
      <!-- Bevel: blur the shape's alpha into a height map, light it, keep the light inside the shape. -->
      <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="height" />
        <feSpecularLighting in="height" surfaceScale="7" specularConstant="0.9" specularExponent="38" lighting-color="#ffffff" result="spec">
          <fePointLight class="pack-light" x="40" y="-120" z="260" />
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="shine" />
        <feComposite in="SourceGraphic" in2="shine" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0" />
      </filter>
      <filter id="bevel-sm" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="height" />
        <feSpecularLighting in="height" surfaceScale="4" specularConstant="1" specularExponent="20" lighting-color="#ffffff" result="spec">
          <fePointLight class="pack-light" x="40" y="-80" z="200" />
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="shine" />
        <feComposite in="SourceGraphic" in2="shine" operator="arithmetic" k1="0" k2="1" k3="0.6" k4="0" />
      </filter>
      <filter id="diecut" x="-30%" y="-30%" width="160%" height="160%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="dilate" />
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap in="dilate" in2="noise" scale="2" result="edge" />
        <feFlood flood-color="#ffffff" result="paper" />
        <feComposite in="paper" in2="edge" operator="in" result="outline" />
        <feMerge>
          <feMergeNode in="outline" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
        <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#021428" flood-opacity="0.45" />
      </filter>
    </svg>

    <div class="pool" aria-hidden="true">
      <div class="pool-tiles"></div>
      <div class="pool-light"></div>
      <div class="pool-bubbles"></div>
    </div>

    <main class="stage" id="stage" data-phase="sealed">
      <p class="status" id="status" aria-live="polite">Swipe across the top of the pack to tear it open.</p>

      <!-- The sealed pack -->
      <div class="pack" id="pack">
        <div class="pack-inner">
          <div class="pack-body">
            <div class="pack-foil"></div>
            <div class="pack-sheen"></div>
            <div class="pack-band"></div>
            <div class="pack-print">
              <p class="pack-banner"><span>Emmett</span></p>
              <div class="pack-hero">
                <p class="pack-turns">turns</p>
                <p class="pack-seven">7</p>
              </div>
              <p class="pack-logo"><span class="pack-logo-top">Splash</span><span class="pack-logo-bottom">Legends</span></p>
              <p class="pack-count">7 party cards inside</p>
            </div>
            <div class="pack-sticker" aria-hidden="true">
              <svg viewBox="0 0 120 120">
                <defs>
                  <linearGradient id="stickerBurst" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f2ff9a" />
                    <stop offset=".45" stop-color="#c6ff1a" />
                    <stop offset="1" stop-color="#7fd000" />
                  </linearGradient>
                  <radialGradient id="stickerFoil" cx="32%" cy="28%" r="70%">
                    <stop offset="0" stop-color="#fff" stop-opacity=".9" />
                    <stop offset=".35" stop-color="#ff7ab8" stop-opacity=".7" />
                    <stop offset=".6" stop-color="#22e4ff" stop-opacity=".6" />
                    <stop offset="1" stop-color="#000" stop-opacity="0" />
                  </radialGradient>
                  <linearGradient id="stickerOne" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffffff" />
                    <stop offset=".55" stop-color="#ffe27a" />
                    <stop offset="1" stop-color="#ffb21a" />
                  </linearGradient>
                </defs>
                <path d="M60.0 3.0 L67.0 11.5 L76.1 5.3 L80.4 15.4 L90.8 12.0 L92.1 23.0 L103.1 22.7 L101.2 33.5 L111.8 36.3 L107.0 46.2 L116.4 51.9 L109.0 60.0 L116.4 68.1 L107.0 73.8 L111.8 83.7 L101.2 86.5 L103.1 97.3 L92.1 97.0 L90.8 108.0 L80.4 104.6 L76.1 114.7 L67.0 108.5 L60.0 117.0 L53.0 108.5 L43.9 114.7 L39.6 104.6 L29.2 108.0 L27.9 97.0 L16.9 97.3 L18.8 86.5 L8.2 83.7 L13.0 73.8 L3.6 68.1 L11.0 60.0 L3.6 51.9 L13.0 46.2 L8.2 36.3 L18.8 33.5 L16.9 22.7 L27.9 23.0 L29.2 12.0 L39.6 15.4 L43.9 5.3 L53.0 11.5Z" fill="url(#stickerBurst)" />
                <path d="M60.0 3.0 L67.0 11.5 L76.1 5.3 L80.4 15.4 L90.8 12.0 L92.1 23.0 L103.1 22.7 L101.2 33.5 L111.8 36.3 L107.0 46.2 L116.4 51.9 L109.0 60.0 L116.4 68.1 L107.0 73.8 L111.8 83.7 L101.2 86.5 L103.1 97.3 L92.1 97.0 L90.8 108.0 L80.4 104.6 L76.1 114.7 L67.0 108.5 L60.0 117.0 L53.0 108.5 L43.9 114.7 L39.6 104.6 L29.2 108.0 L27.9 97.0 L16.9 97.3 L18.8 86.5 L8.2 83.7 L13.0 73.8 L3.6 68.1 L11.0 60.0 L3.6 51.9 L13.0 46.2 L8.2 36.3 L18.8 33.5 L16.9 22.7 L27.9 23.0 L29.2 12.0 L39.6 15.4 L43.9 5.3 L53.0 11.5Z" fill="url(#stickerFoil)" style="mix-blend-mode: color-dodge" />
                <circle cx="60" cy="60" r="44" fill="#050b14" />
                <circle cx="60" cy="60" r="44" fill="none" stroke="#000" stroke-width="2" />
                <circle cx="60" cy="60" r="41" fill="none" stroke="#c6ff1a" stroke-width="1.2" opacity=".75" />
                <text class="sticker-stars" x="60" y="30" text-anchor="middle">★ ★ ★</text>
                <text class="sticker-one" x="60" y="62" text-anchor="middle">1</text>
                <text class="sticker-word" x="60" y="77" text-anchor="middle">SECRET</text>
                <text class="sticker-word" x="60" y="92" text-anchor="middle">RARE!</text>
              </svg>
            </div>
            <div class="pack-crimp pack-crimp-bottom"></div>
          </div>

          <!-- The strip that tears off -->
          <div class="pack-strip" id="strip">
            <div class="pack-foil"></div>
            <div class="pack-crimp pack-crimp-top"></div>
          </div>
          <div class="tear-line" aria-hidden="true">
            <svg viewBox="0 0 100 10" preserveAspectRatio="none">
              <path class="tear-dash" d="M0 5 H100" />
            </svg>
            <div class="tear-rip-wrap">
              <svg viewBox="0 0 100 10" preserveAspectRatio="none">
                <path class="tear-rip" d="M0 5 L4 2 L8 7 L12 3 L16 8 L20 2 L24 6 L28 3 L32 8 L36 2 L40 7 L44 3 L48 8 L52 2 L56 6 L60 3 L64 8 L68 2 L72 7 L76 3 L80 8 L84 2 L88 6 L92 3 L96 8 L100 4" />
              </svg>
            </div>
          </div>
          <div class="tear-hint" aria-hidden="true">
            <span class="tear-finger"></span>
          </div>
        </div>
      </div>
      <button class="open-button" id="openButton" type="button">Open the pack</button>

      <!-- The cards come out of the pack into this stack -->
      <section class="deck" id="deck" aria-label="Your party cards" aria-roledescription="card stack">
        <div class="deck-cards" id="deckCards"></div>
      </section>
      <div class="deck-controls" id="deckControls">
        <button class="round-button" id="prevButton" type="button" aria-label="Previous card">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <p class="deck-count" id="deckCount">1 of 7</p>
        <button class="round-button" id="nextButton" type="button" aria-label="Next card">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
        <button class="tilt-button" id="tiltButton" type="button" hidden>Tilt to shine</button>
      </div>

      <!-- After the last card: the whole set, and the plain facts -->
      <section class="binder" id="binder" aria-labelledby="binderTitle" hidden>
        <h1 class="binder-title" id="binderTitle">Can't wait to party with you!</h1>
        <p class="binder-lead">You collected all 7 cards. Tap one to look closer.</p>
        <div class="binder-grid" id="binderGrid"></div>
        <div class="facts" id="facts"></div>
        <button class="again-button" id="againButton" type="button">Open the pack again</button>
      </section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-card" id="lightboxCard"></div>
      <button class="lightbox-close" id="lightboxClose" type="button">Close</button>
    </div>


    <script type="module" src="js/main.js"></script>
  </body>
</html>
