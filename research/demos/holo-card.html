<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Holo card study</title>
    <link rel="stylesheet" href="foil.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 40% at 50% 0%, #2a2140, transparent 70%),
          #0e0c12;
        color: #f4efe6;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 1.25rem;
        padding: 2rem 1rem 3rem;
      }
      h1 {
        margin: 0;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        font-weight: 500;
        font-size: 1.6rem;
      }
      p {
        margin: 0;
        max-width: 36rem;
        text-align: center;
        color: #c9c0b4;
      }
      .switch {
        display: flex;
        gap: 0.4rem;
      }
      button {
        border: 1px solid rgb(255 255 255 / 0.2);
        background: transparent;
        color: inherit;
        border-radius: 999px;
        padding: 0.4rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #f4efe6;
        color: #16130f;
      }
      code {
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Holo card</h1>
      <p>
        Move over the card. Common is gloss, rare foils the window, secret foils the whole card.
        Switch rarity to compare the same layers.
      </p>
      <article class="holo" id="card" data-rarity="rare">
        <div class="holo-art art-night">
          <svg class="creature" viewBox="0 0 200 160" aria-hidden="true">
            <ellipse cx="70" cy="86" rx="58" ry="48" fill="#f3d7b0" transform="rotate(-24 70 86)" />
            <ellipse cx="130" cy="86" rx="58" ry="48" fill="#f0b7c8" transform="rotate(24 130 86)" />
            <ellipse cx="70" cy="78" rx="22" ry="16" fill="#1c140e" opacity="0.8" />
            <ellipse cx="130" cy="78" rx="22" ry="16" fill="#1c140e" opacity="0.8" />
            <circle cx="70" cy="76" r="5" fill="#f8e7c4" />
            <circle cx="130" cy="76" r="5" fill="#f8e7c4" />
            <ellipse cx="100" cy="92" rx="14" ry="36" fill="#24180f" />
            <path d="M92 62c-16-28-40-24-36-4" fill="none" stroke="#24180f" stroke-width="3" stroke-linecap="round" />
            <path d="M108 62c16-28 40-24 36-4" fill="none" stroke="#24180f" stroke-width="3" stroke-linecap="round" />
          </svg>
        </div>
        <div class="holo-fx" aria-hidden="true">
          <div class="holo-foil"></div>
          <div class="holo-bars"></div>
          <div class="holo-refract holo-refract-a"></div>
          <div class="holo-refract holo-refract-b"></div>
          <div class="holo-spot"></div>
        </div>
        <div class="holo-copy">
          <div>
            <div class="holo-kicker"><span>When</span><span>No. 01</span></div>
            <h2>Lumen Moth</h2>
          </div>
          <p class="holo-fact">Saturday, after dark</p>
        </div>
      </article>
      <div class="switch" role="group" aria-label="Rarity">
        <button type="button" data-rarity="common" aria-pressed="false">Common</button>
        <button type="button" data-rarity="rare" aria-pressed="true">Rare</button>
        <button type="button" data-rarity="secret" aria-pressed="false">Secret</button>
      </div>
    </main>
    <script src="pointer.js"></script>
    <script>
      const card = document.querySelector("#card")
      bindSurface(card)
      for (const button of document.querySelectorAll(".switch button")) {
        button.addEventListener("click", () => {
          card.dataset.rarity = button.dataset.rarity
          for (const other of document.querySelectorAll(".switch button")) {
            other.setAttribute("aria-pressed", String(other === button))
          }
        })
      }
    </script>
  </body>
</html>
