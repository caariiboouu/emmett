<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pack unwrap study</title>
    <link rel="stylesheet" href="foil.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(50% 40% at 50% 0%, #2c2238, transparent 60%),
          #0c0a10;
        color: #f6f1e6;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        perspective: 1200px;
        padding: 4rem 1rem 5rem;
        box-sizing: border-box;
      }
      h1 {
        position: absolute;
        top: 1.1rem;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        font-weight: 500;
        font-size: 1.3rem;
      }
      .pack {
        --px: 0.1;
        --py: -0.15;
        --fan: min(78px, 12vw);
        position: relative;
        width: min(250px, 68vw);
        aspect-ratio: 63 / 88;
        transform: rotateX(calc(var(--py) * 8deg)) rotateY(calc(var(--px) * -10deg));
        transform-style: preserve-3d;
        transition: transform 0.45s ease;
      }
      .pack.open {
        transform: none;
      }
      .fan {
        position: absolute;
        inset: 5% 7%;
        z-index: 1;
        opacity: 0;
        pointer-events: none;
      }
      .pack.open .fan {
        z-index: 4;
        opacity: 1;
        pointer-events: auto;
        transition: opacity 0.35s ease 0.12s;
      }
      .pack .holo {
        position: absolute;
        inset: 0;
        z-index: var(--z, 1);
        width: auto;
        height: auto;
        aspect-ratio: auto;
        padding: 0;
        border: 0;
        text-align: left;
        color: inherit;
        cursor: pointer;
        transform: none;
      }
      .pack.open .holo {
        transform:
          translateX(calc((var(--i) - 2) * var(--fan)))
          translateY(calc((var(--i) - 2) * (var(--i) - 2) * 7px))
          rotate(calc((var(--i) - 2) * 7deg))
          rotateX(calc(var(--py) * 10deg))
          rotateY(calc(var(--px) * -12deg));
        transition:
          transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.3s ease;
        transition-delay: calc(0.22s + var(--i) * 60ms);
      }
      .pack.open .holo.is-up {
        transform:
          translateY(-6%)
          scale(1.14)
          rotate(0deg)
          rotateX(calc(var(--py) * 10deg))
          rotateY(calc(var(--px) * -12deg));
        z-index: 6;
        transition-delay: 0s;
      }
      .holo:focus-visible {
        outline: 2px solid #f6f1e6;
        outline-offset: 3px;
      }
      .shell {
        position: absolute;
        inset: 0;
        z-index: 3;
        border-radius: 8% / 5.6%;
        pointer-events: none;
      }
      .half {
        position: absolute;
        inset: 0;
        display: grid;
        justify-items: center;
        align-content: center;
        overflow: hidden;
        color: #241828;
        filter: url("#crinkle");
        background:
          radial-gradient(80% 60% at 20% 15%, rgb(255 255 255 / 0.55), transparent 45%),
          repeating-linear-gradient(102deg, rgb(255 255 255 / 0.28) 0 2px, transparent 2px 7px),
          linear-gradient(155deg, #f7f3ff 0%, #c0b0ff 30%, #ffd4ef 58%, #b7f3e6 82%, #f4efff);
        background-blend-mode: soft-light, overlay, normal;
        box-shadow:
          inset 0 0 0 2px rgb(255 255 255 / 0.45),
          0 16px 30px rgb(0 0 0 / 0.28);
        transition:
          transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.4s ease 0.2s;
      }
      .half::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: linear-gradient(100deg, transparent 40%, rgb(255 255 255 / 0.55) 50%, transparent 60%);
        mix-blend-mode: soft-light;
        animation: sweep 3.6s ease-in-out infinite;
      }
      .half.top {
        clip-path: polygon(0 0, 100% 0, 100% 48%, 0 48%);
        align-content: start;
        padding-top: 18%;
        border-radius: 18px 18px 0 0;
      }
      .half.bottom {
        clip-path: polygon(0 56%, 100% 56%, 100% 100%, 0 100%);
        align-content: end;
        padding-bottom: 16%;
        border-radius: 0 0 18px 18px;
      }
      .set-name,
      .hint {
        position: relative;
        margin: 0;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
      }
      .set-name {
        font-size: 1.55rem;
        letter-spacing: -0.03em;
      }
      .sub,
      .hint {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .pack.open .half.top {
        transform: translateY(-78%) rotateX(32deg) rotateZ(-7deg);
        opacity: 0;
      }
      .pack.open .half.bottom {
        transform: translateY(78%) rotateX(-26deg) rotateZ(5deg);
        opacity: 0;
      }
      .seam {
        position: absolute;
        left: 8%;
        right: 8%;
        top: 51%;
        height: 16px;
        translate: 0 -50%;
        background: radial-gradient(circle at 50% 50%, #2a1c30 0 1.5px, transparent 2.2px);
        background-size: 12px 16px;
        opacity: 0.55;
      }
      .pack.open .seam {
        opacity: 0;
      }
      .seal,
      .replay {
        position: absolute;
        z-index: 4;
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      .seal {
        z-index: 5;
        left: 50%;
        top: 62%;
        translate: -50% 0;
        background: #241828;
        color: #f6f1e6;
        border-radius: 999px;
        padding: 0.55rem 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }
      .pack.open .seal {
        opacity: 0;
        pointer-events: none;
      }
      .replay {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        background: transparent;
        color: #f6f1e6;
        border: 1px solid rgb(255 255 255 / 0.3);
        border-radius: 999px;
        padding: 0.4rem 0.75rem;
      }
      .replay[hidden] {
        display: none;
      }
      @keyframes sweep {
        50% {
          translate: 18% 0;
        }
      }
      @media (max-width: 740px) {
        .fan {
          inset: 16% 18%;
        }
        .pack {
          --fan: 58px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .half,
        .pack,
        .pack.open .holo {
          transition: none;
        }
        .half::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="crinkle" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="3" seed="2" result="noise"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7"></feDisplacementMap>
      </filter>
    </svg>
    <h1>Birthday Beasts</h1>
    <div class="stage">
      <div class="pack" id="pack">
        <div class="fan" id="fan">
          <article class="holo" role="button" tabindex="-1" aria-disabled="true" data-rarity="rare" style="--i: 0; --z: 2">
            <div class="holo-art art-night">
              <svg class="creature" viewBox="0 0 200 160" aria-hidden="true">
                <ellipse cx="70" cy="86" rx="58" ry="48" fill="#f3d7b0" transform="rotate(-24 70 86)" />
                <ellipse cx="130" cy="86" rx="58" ry="48" fill="#f0b7c8" transform="rotate(24 130 86)" />
                <ellipse cx="100" cy="92" rx="14" ry="36" fill="#24180f" />
              </svg>
            </div>
            <div class="holo-fx" aria-hidden="true"><div class="holo-foil"></div><div class="holo-bars"></div><div class="holo-refract holo-refract-a"></div><div class="holo-refract holo-refract-b"></div><div class="holo-spot"></div></div>
            <div class="holo-copy"><div><div class="holo-kicker"><span>When</span><span>01</span></div><h2>Lumen Moth</h2></div><p class="holo-fact">Saturday, after dark</p></div>
          </article>
          <article class="holo" role="button" tabindex="-1" aria-disabled="true" data-rarity="common" style="--i: 1; --z: 3">
            <div class="holo-art art-moss">
              <svg class="creature" viewBox="0 0 200 160" aria-hidden="true">
                <ellipse cx="100" cy="96" rx="62" ry="42" fill="#8d9a78" />
                <circle cx="78" cy="88" r="6" fill="#1c2414" />
                <circle cx="122" cy="88" r="6" fill="#1c2414" />
                <path d="M70 112c16 10 44 10 60 0" fill="none" stroke="#1c2414" stroke-width="3" stroke-linecap="round" />
              </svg>
            </div>
            <div class="holo-fx" aria-hidden="true"><div class="holo-foil"></div><div class="holo-bars"></div><div class="holo-refract holo-refract-a"></div><div class="holo-refract holo-refract-b"></div><div class="holo-spot"></div></div>
            <div class="holo-copy"><div><div class="holo-kicker"><span>Where</span><span>02</span></div><h2>Pebble Toad</h2></div><p class="holo-fact">The backyard</p></div>
          </article>
          <article class="holo" role="button" tabindex="-1" aria-disabled="true" data-rarity="secret" style="--i: 2; --z: 5">
            <div class="holo-art art-ink"></div>
            <div class="holo-fx" aria-hidden="true"><div class="holo-foil"></div><div class="holo-bars"></div><div class="holo-refract holo-refract-a"></div><div class="holo-refract holo-refract-b"></div><div class="holo-spot"></div></div>
            <div class="holo-copy"><div><div class="holo-kicker"><span>You</span><span>03</span></div><h2>A seat is saved</h2></div><p class="holo-fact">Come as you are</p></div>
          </article>
          <article class="holo" role="button" tabindex="-1" aria-disabled="true" data-rarity="rare" style="--i: 3; --z: 4">
            <div class="holo-art art-tide">
              <svg class="creature" viewBox="0 0 200 160" aria-hidden="true">
                <path d="M20 90c30-30 50 20 80-6 28-24 50 10 80 4" fill="none" stroke="#d7fff4" stroke-width="10" stroke-linecap="round" />
                <path d="M150 86c24 8 28 24 10 30" fill="none" stroke="#ffd0ea" stroke-width="6" stroke-linecap="round" />
              </svg>
            </div>
            <div class="holo-fx" aria-hidden="true"><div class="holo-foil"></div><div class="holo-bars"></div><div class="holo-refract holo-refract-a"></div><div class="holo-refract holo-refract-b"></div><div class="holo-spot"></div></div>
            <div class="holo-copy"><div><div class="holo-kicker"><span>Bring</span><span>04</span></div><h2>Ribbon Eel</h2></div><p class="holo-fact">A sweater</p></div>
          </article>
          <article class="holo" role="button" tabindex="-1" aria-disabled="true" data-rarity="common" style="--i: 4; --z: 1">
            <div class="holo-art art-dusk">
              <svg class="creature" viewBox="0 0 200 160" aria-hidden="true">
                <path d="M40 70c20-40 40-10 60 0 20-10 40-40 60 0-10 40-40 50-60 36-20 14-50 4-60-36z" fill="#2a1a16" />
                <circle cx="86" cy="78" r="4" fill="#f6e2cf" />
                <circle cx="114" cy="78" r="4" fill="#f6e2cf" />
              </svg>
            </div>
            <div class="holo-fx" aria-hidden="true"><div class="holo-foil"></div><div class="holo-bars"></div><div class="holo-refract holo-refract-a"></div><div class="holo-refract holo-refract-b"></div><div class="holo-spot"></div></div>
            <div class="holo-copy"><div><div class="holo-kicker"><span>Eat</span><span>05</span></div><h2>Crumb Bat</h2></div><p class="holo-fact">Cake, obviously</p></div>
          </article>
        </div>
        <div class="shell" aria-hidden="true">
          <div class="half top">
            <p class="set-name">Birthday Beasts</p>
            <p class="sub">Five cards</p>
          </div>
          <div class="seam"></div>
          <div class="half bottom">
            <p class="hint">Peel to open</p>
          </div>
        </div>
        <button class="seal" id="seal" type="button">Open the pack</button>
      </div>
    </div>
    <button class="replay" id="replay" type="button" hidden>Seal it again</button>
    <script src="pointer.js"></script>
    <script>
      const pack = document.querySelector("#pack")
      const seal = document.querySelector("#seal")
      const replay = document.querySelector("#replay")
      const cards = [...document.querySelectorAll(".holo")]

      bindSurface(pack)
      for (const card of cards) bindSurface(card)

      function setCardsEnabled(enabled) {
        for (const card of cards) {
          card.setAttribute("aria-disabled", String(!enabled))
          card.tabIndex = enabled ? 0 : -1
        }
      }

      function openPack() {
        pack.classList.add("open")
        seal.disabled = true
        replay.hidden = false
        setCardsEnabled(true)
      }

      function sealPack() {
        pack.classList.remove("open")
        seal.disabled = false
        replay.hidden = true
        for (const card of cards) card.classList.remove("is-up")
        setCardsEnabled(false)
      }

      seal.addEventListener("click", openPack)
      // The sealed pack is tilted in 3D, and that transform steals hit tests
      // from the button. A press anywhere on the pack opens it.
      pack.addEventListener("pointerdown", (event) => {
        if (pack.classList.contains("open")) return
        if (event.target.closest(".holo")) return
        openPack()
      })
      replay.addEventListener("click", sealPack)
      for (const card of cards) {
        card.addEventListener("click", () => {
          if (card.getAttribute("aria-disabled") === "true") return
          const up = card.classList.contains("is-up")
          for (const other of cards) other.classList.remove("is-up")
          if (!up) card.classList.add("is-up")
        })
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault()
            card.click()
          }
        })
      }
    </script>
  </body>
</html>
